name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Privacy and credential audit
        shell: pwsh
        run: ./scripts/audit-release.ps1
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Locked restore and dependency audit
        run: dotnet restore LimitLens.slnx --locked-mode -p:NuGetAudit=true -p:NuGetAuditMode=all
      - name: Build
        run: dotnet build LimitLens.slnx -c Release --no-restore
      - name: Test
        run: dotnet test LimitLens.slnx -c Release --no-build --no-restore --logger "trx;LogFileName=tests.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
