name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Privacy and credential audit
        shell: pwsh
        run: ./scripts/audit-release.ps1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Locked restore and dependency audit
        run: dotnet restore LimitLens.slnx --locked-mode -p:Configuration=Release -p:NuGetAudit=true -p:NuGetAuditMode=all
      - name: Build
        run: dotnet build LimitLens.slnx -c Release --no-restore
      - name: Test
        run: dotnet test LimitLens.slnx -c Release --no-build --no-restore --logger "trx;LogFileName=tests.trx"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
